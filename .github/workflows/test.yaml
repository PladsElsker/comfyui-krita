name: ComfyUI Frontend Tests

on:
    pull_request:
        branches: ["**"]
    schedule:
        - cron: "0 0 * * *"

jobs:
    frontend-tests:
        name: ComfyUI Frontend Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  path: custom-node

            - name: Clone ComfyUI backend
              run: |
                  git clone https://github.com/comfyanonymous/ComfyUI.git ComfyUI

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.13"

            - name: Upgrade pip
              run: |
                  set -eux

                  python -m pip install --upgrade pip

            - name: Create test venv
              run: |
                  set -eux

                  python -m venv "${{ github.workspace }}/custom-node/venv"

                  "${{ github.workspace }}/custom-node/venv/bin/python" -m pip install -r "${{ github.workspace }}/custom-node/tests/requirements.txt"
                  "${{ github.workspace }}/custom-node/venv/bin/python" -m playwright install --with-deps

            - name: Create ComfyUI venv
              run: |
                  python -m venv "${{ github.workspace }}/ComfyUI/venv"

                  "${{ github.workspace }}/ComfyUI/venv/bin/python" -m pip install --upgrade pip
                  "${{ github.workspace }}/ComfyUI/venv/bin/python" -m pip install -r ComfyUI/requirements.txt

            - name: Install custom node in ComfyUI
              shell: bash
              run: |
                  set -eux

                  ln -s "${{ github.workspace }}/custom-node" "${{ github.workspace }}/ComfyUI/custom_nodes/comfyui-krita"

            - name: Start ComfyUI server
              shell: bash
              run: |
                  set -eux

                  nohup "${{ github.workspace }}/ComfyUI/venv/bin/python" "${{ github.workspace }}/ComfyUI/main.py" --cpu --front-end-version "Comfy-Org/ComfyUI_frontend@latest" > "${{ github.workspace }}/comfyui.log" 2>&1 &

            - name: Wait for ComfyUI server
              shell: bash
              run: |
                  set -eux

                  cd "${{ github.workspace }}/custom-node/ci"
                  "${{ github.workspace }}/custom-node/venv/bin/python" wait_for_comfyui.py --timeout 20

            - name: Run tests
              shell: bash
              run: |
                  set -eux

                  cd "${{ github.workspace }}/custom-node/tests"
                  "${{ github.workspace }}/custom-node/venv/bin/python" -m pytest -q
