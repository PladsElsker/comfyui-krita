name: ComfyUI Frontend Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: ["**"]
    schedule:
        - cron: "0 3 * * *"

jobs:
    frontend-tests:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  path: custom-node

            - name: Clone ComfyUI backend
              run: |
                  git clone https://github.com/comfyanonymous/ComfyUI.git ComfyUI

            - name: Install system deps for Playwright (Ubuntu)
              run: |
                  sudo apt-get update
                      sudo apt-get install -y \
                      libglib2.0-0 libnss3 libxss1 libavif16 \
                      fonts-liberation libatk-bridge2.0-0 libgtk-3-0 \
                      libgtk-4.so.1 libgraphene-1.0-0 libwoff2dec1 \
                      libvpx9 libevent-2.1-7 libopus0 \
                      gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
                      gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
                      gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x \
                      libflite1 libflite-usenglish1 libflite-cmu-grapheme-lang1 \
                      libflite-cmu-grapheme-lex1 libflite-cmu-indic-lang1 \
                      libflite-cmu-indic-lex1 libflite-cmulex1 libflite-cmu-time-awb1 \
                      libflite-cmu-us-awb1 libflite-cmu-us-kal161 libflite-cmu-us-kal1 \
                      libflite-cmu-us-rms1 libflite-cmu-us-slt1 libharfbuzz-icu0 \
                      libsecret-1-0 libhyphen0 libmanette-0.2-0 libgles2-mesa libx264-dev

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.13"

            - name: Create and populate virtualenvs
              run: |
                  set -eux

                  python -m pip install --upgrade pip
                  python -m venv "${{ github.workspace }}/custom-node/venv-tests"
                  . "${{ github.workspace }}/custom-node/venv-tests/bin/activate"
                  pip install -r "${{ github.workspace }}/custom-node/tests/requirements.txt"

                  python -m playwright install
                  deactivate

                  python -m venv "${{ github.workspace }}/ComfyUI/venv"
                  . "${{ github.workspace }}/ComfyUI/venv/bin/activate"

                  python -m pip install --upgrade pip
                  pip install -r ComfyUI/requirements.txt
                  deactivate

            - name: Start ComfyUI server
              shell: bash
              run: |
                  set -eux

                  . "${{ github.workspace }}/ComfyUI/venv/bin/activate"
                  cd "${{ github.workspace }}/ComfyUI"

                  nohup python main.py --front-end-version "Comfy-Org/ComfyUI_frontend@latest" > "${{ github.workspace }}/comfyui.log" 2>&1 &

            - name: Wait for ComfyUI server
              shell: bash
              run: |
                  set -eux

                  . "${{ github.workspace }}/custom-node/venv-tests/bin/activate"

                  python "${{ github.workspace }}/custom-node/tests/wait_for_comfyui.py" --timeout 120

            - name: Run frontend tests
              shell: bash
              working-directory: "${{ github.workspace }}/custom-node/tests"
              run: |
                  set -eux

                  . "${{ github.workspace }}/custom-node/venv-tests/bin/activate"
                  pytest -q
