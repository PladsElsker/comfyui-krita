name: ComfyUI Frontend Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: ["**"]
    schedule:
        - cron: "0 3 * * *"

jobs:
    frontend-tests:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.13"

            - name: Install ComfyUI
              run: |
                  pip install git+https://github.com/comfyanonymous/ComfyUI.git@latest

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install playwright
                  python -m playwright install

            - name: Start ComfyUI server
              run: |
                  nohup python -m ComfyUI.main --front-end-version Comfy-Org/ComfyUI_frontend@latest

            - name: Wait for ComfyUI server
              run: |
                  python wait_for_comfyui.py --timeout 20

            - name: Run frontend tests
              working-directory: ./tests
              run: |
                  pytest -q
