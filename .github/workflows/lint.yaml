name: Lint

on:
    pull_request:
        branches: ["**"]

jobs:
    ruff:
        name: Ruff Linting
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Install Ruff
              run: |
                  python -m pip install --upgrade pip
                  pip install ruff

            - name: Run Ruff
              run: ruff check .
    black:
        name: Black Linting
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Install Black
              run: |
                  python -m pip install --upgrade pip
                  pip install black

            - name: Run Black
              run: black --check .
